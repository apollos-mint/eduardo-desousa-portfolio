<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotterdam Mega-Port 3D Intro Sequence - Standalone Offline Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #020617; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; color: #f8fafc; }
    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
    
    /* Top Telemetry HUD */
    .hud-top {
      position: absolute; top: 18px; left: 24px; z-index: 10;
      background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 10px;
      padding: 10px 18px; display: flex; flex-direction: column; gap: 4px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    .hud-title { font-size: 13px; font-weight: 700; letter-spacing: 0.12em; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .hud-title::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #10b981; box-shadow: 0 0 10px #10b981; }
    .hud-sub { font-size: 10px; color: #94a3b8; letter-spacing: 0.08em; }

    /* Bottom Control Bar */
    .controls-bar {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 10;
      width: 90%; max-width: 860px; background: rgba(15, 23, 42, 0.90); backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 14px;
      padding: 14px 22px; display: flex; flex-direction: column; gap: 10px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
    }
    .status-row { display: flex; justify-content: space-between; align-items: center; font-size: 11px; letter-spacing: 0.08em; font-weight: 600; }
    .phase-text { color: #38bdf8; display: flex; align-items: center; gap: 6px; }
    .phase-text::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #0284c7; }
    .time-text { color: #f8fafc; font-family: monospace; }
    
    .slider-row { display: flex; align-items: center; gap: 12px; }
    input[type=range] {
      flex: 1; -webkit-appearance: none; appearance: none;
      height: 6px; border-radius: 3px; background: rgba(51, 65, 85, 0.8); outline: none; cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 16px; height: 16px; border-radius: 50%; background: #38bdf8;
      cursor: pointer; box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
    }

    .btn-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .btn-group { display: flex; gap: 6px; }
    button {
      background: rgba(30, 41, 59, 0.85); border: 1px solid rgba(71, 85, 105, 0.6);
      color: #e2e8f0; font-size: 11px; font-weight: 600; letter-spacing: 0.05em;
      padding: 6px 14px; border-radius: 8px; cursor: pointer; transition: all 0.15s ease;
    }
    button:hover { background: rgba(56, 189, 248, 0.2); border-color: #38bdf8; color: #38bdf8; }
    button.active { background: #0284c7; border-color: #38bdf8; color: #fff; }
    .speed-select {
      background: rgba(30, 41, 59, 0.85); border: 1px solid rgba(71, 85, 105, 0.6);
      color: #38bdf8; font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: 8px; outline: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="hud-top">
    <div class="hud-title">EDUARDO DE SOUSA // ROTTERDAM LOGISTICS NODE</div>
    <div class="hud-sub">IMO 9840217 · STS AUTOMATION · LAT 51.9244° N · LON 4.4777° E · MAASVLAKTE II</div>
  </div>

  <div class="controls-bar">
    <div class="status-row">
      <div id="phaseDisplay" class="phase-text">ACT I // OCEAN CONTAINER VESSEL BERTHING</div>
      <div id="timeDisplay" class="time-text">T = 0.00s / 7.50s</div>
    </div>
    <div class="slider-row">
      <input type="range" id="scrubber" min="0" max="7.5" step="0.02" value="0">
    </div>
    <div class="btn-row">
      <div class="btn-group">
        <button id="btnPlayPause">⏸ PAUSE</button>
        <button id="btnRestart">↺ RESTART</button>
      </div>
      <div class="btn-group">
        <button id="btnAct1">ACT I (0.0s)</button>
        <button id="btnAct2">ACT II (2.5s)</button>
        <button id="btnAct3">ACT III (5.0s)</button>
      </div>
      <div class="btn-group">
        <button id="btnToggleLoop" class="active">LOOP: ON</button>
      </div>
    </div>
  </div>

  <script>
    // --- STANDALONE THREE.JS LOGISTICS SCENE ---
    const container = document.getElementById('canvas-container');
    const width = window.innerWidth;
    const height = window.innerHeight;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020712);
    scene.fog = new THREE.Fog(0x061426, 120, 520);

    const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.35;
    container.appendChild(renderer.domElement);

    // 1. SKY DOME
    const skyCanvas = document.createElement('canvas');
    skyCanvas.width = 512; skyCanvas.height = 512;
    const sCtx = skyCanvas.getContext('2d');
    const skyGrad = sCtx.createLinearGradient(0, 0, 0, 512);
    skyGrad.addColorStop(0.0, '#01040a');
    skyGrad.addColorStop(0.25, '#040d1c');
    skyGrad.addColorStop(0.50, '#071830');
    skyGrad.addColorStop(0.72, '#0c274c');
    skyGrad.addColorStop(0.88, '#133a6c');
    skyGrad.addColorStop(0.96, '#1e528e');
    skyGrad.addColorStop(1.0, '#061426');
    sCtx.fillStyle = skyGrad;
    sCtx.fillRect(0, 0, 512, 512);
    const skyTex = new THREE.CanvasTexture(skyCanvas);
    const skyMesh = new THREE.Mesh(
      new THREE.SphereGeometry(650, 32, 16),
      new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, depthWrite: false, fog: false })
    );
    scene.add(skyMesh);

    // 2. LUMINOUS MOON & CORONA (Upper-Left Background)
    const moonGroup = new THREE.Group();
    moonGroup.position.set(-110, 110, -90);
    const moonMesh = new THREE.Mesh(
      new THREE.SphereGeometry(12, 24, 24),
      new THREE.MeshBasicMaterial({ color: 0xfffbeb, fog: false })
    );
    moonGroup.add(moonMesh);

    const haloCanvas = document.createElement('canvas');
    haloCanvas.width = 128; haloCanvas.height = 128;
    const hCtx = haloCanvas.getContext('2d');
    const hGrad = hCtx.createRadialGradient(64, 64, 8, 64, 64, 64);
    hGrad.addColorStop(0, 'rgba(255, 251, 235, 0.45)');
    hGrad.addColorStop(0.35, 'rgba(56, 189, 248, 0.18)');
    hGrad.addColorStop(1, 'rgba(2, 6, 23, 0)');
    hCtx.fillStyle = hGrad;
    hCtx.fillRect(0, 0, 128, 128);
    const haloTex = new THREE.CanvasTexture(haloCanvas);
    const haloMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(64, 64),
      new THREE.MeshBasicMaterial({ map: haloTex, transparent: true, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, depthWrite: false, fog: false })
    );
    haloMesh.rotation.y = Math.PI / 4;
    moonGroup.add(haloMesh);
    scene.add(moonGroup);

    // 3. STARS
    const starCount = 600;
    const starGeo = new THREE.BufferGeometry();
    const starPos = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.random() * Math.PI * 0.35 + 0.04;
      const r = 580;
      starPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      starPos[i * 3 + 1] = r * Math.cos(phi);
      starPos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta) - 50;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xbae6fd, size: 2.0, transparent: true, opacity: 0.85, fog: false })));

    // 4. WATER BASIN (Z < 0)
    const waterGeo = new THREE.PlaneGeometry(900, 420);
    const waterMat = new THREE.MeshStandardMaterial({ color: 0x022544, roughness: 0.10, metalness: 0.88 });
    const water = new THREE.Mesh(waterGeo, waterMat);
    water.rotation.x = -Math.PI / 2;
    water.position.set(-80, 0, -130);
    scene.add(water);

    // 5. LIGHTING (Balanced, high-contrast, professional cinematic port lighting)
    scene.add(new THREE.AmbientLight(0xdbeafe, 1.25));
    const moonLight = new THREE.DirectionalLight(0x7dd3fc, 2.2);
    moonLight.position.set(-70, 85, -60);
    scene.add(moonLight);

    const termLight = new THREE.DirectionalLight(0xffedd5, 1.9);
    termLight.position.set(30, 60, 40);
    scene.add(termLight);

    // 6. QUAYSIDE DOCK & RAILS (Z >= 0)
    const dockGeo = new THREE.BoxGeometry(450, 6, 260);
    const dockMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.55, metalness: 0.35 });
    const dock = new THREE.Mesh(dockGeo, dockMat);
    dock.position.set(0, -3.0, 120);
    scene.add(dock);

    // Safety hazard edge stripes (Z = -0.1 to 1.8)
    const stripeCanvas = document.createElement('canvas');
    stripeCanvas.width = 512; stripeCanvas.height = 64;
    const sctx = stripeCanvas.getContext('2d');
    sctx.fillStyle = '#0f172a'; sctx.fillRect(0, 0, 512, 64);
    sctx.fillStyle = '#eab308';
    for (let x = -64; x < 512; x += 32) {
      sctx.beginPath();
      sctx.moveTo(x, 64); sctx.lineTo(x + 24, 0); sctx.lineTo(x + 36, 0); sctx.lineTo(x + 12, 64);
      sctx.fill();
    }
    const stripeTex = new THREE.CanvasTexture(stripeCanvas);
    stripeTex.wrapS = THREE.RepeatWrapping;
    stripeTex.repeat.set(24, 1);
    const stripeMesh = new THREE.Mesh(new THREE.PlaneGeometry(450, 1.8), new THREE.MeshStandardMaterial({ map: stripeTex, roughness: 0.5 }));
    stripeMesh.rotation.x = -Math.PI / 2;
    stripeMesh.position.set(0, 0.02, 0.9);
    scene.add(stripeMesh);

    // Gantry Rails with stepped plinth
    const railMat = new THREE.MeshStandardMaterial({ color: 0x64748b, metalness: 0.95, roughness: 0.18 });
    const railHeadMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.98, roughness: 0.08 });
    const railBaseMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.7, roughness: 0.5 });
    [-4, 34].forEach((zRail) => {
      const plinth = new THREE.Mesh(new THREE.BoxGeometry(450, 0.16, 2.2), railBaseMat);
      plinth.position.set(0, 0.08, zRail);
      scene.add(plinth);
      const rBase = new THREE.Mesh(new THREE.BoxGeometry(450, 0.12, 0.6), railMat);
      rBase.position.set(0, 0.20, zRail);
      scene.add(rBase);
      const rHead = new THREE.Mesh(new THREE.BoxGeometry(450, 0.10, 0.28), railHeadMat);
      rHead.position.set(0, 0.31, zRail);
      scene.add(rHead);
    });

    // 7. OUTER BREAKWATER & ILLUMINATED LIGHTHOUSE (No clipping cone)
    const harborBgGroup = new THREE.Group();
    const stoneMat = new THREE.MeshStandardMaterial({ color: 0x09111e, roughness: 0.85, metalness: 0.25 });
    const outerJetty = new THREE.Mesh(new THREE.BoxGeometry(220, 8, 22), stoneMat);
    outerJetty.position.set(-175, 2.5, -25);
    outerJetty.scale.set(0.6, 0.8, 0.6);
    outerJetty.rotation.y = -0.15;
    harborBgGroup.add(outerJetty);

    const lighthouseGroup = new THREE.Group();
    lighthouseGroup.position.set(-170, 0, -22);
    lighthouseGroup.scale.set(0.7, 0.7, 0.7);
    const lhBase = new THREE.Mesh(new THREE.CylinderGeometry(5.2, 6.4, 6, 16), stoneMat);
    lhBase.position.y = 3;
    lighthouseGroup.add(lhBase);

    const lhWhiteMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.35 });
    const lhRedMat = new THREE.MeshStandardMaterial({ color: 0xd93838, roughness: 0.35 });
    [
      { y: 10, h: 8, mat: lhRedMat, r1: 4.6, r2: 4.2 },
      { y: 18, h: 8, mat: lhWhiteMat, r1: 4.2, r2: 3.8 },
      { y: 26, h: 8, mat: lhRedMat, r1: 3.8, r2: 3.4 },
      { y: 34, h: 8, mat: lhWhiteMat, r1: 3.4, r2: 3.0 },
      { y: 41, h: 6, mat: lhRedMat, r1: 3.0, r2: 2.7 },
    ].forEach((b) => {
      const bm = new THREE.Mesh(new THREE.CylinderGeometry(b.r2, b.r1, b.h, 16), b.mat);
      bm.position.y = b.y;
      lighthouseGroup.add(bm);
    });

    // Emissive lantern beacon (Pulsing warm beacon without oversized clipping cone)
    const lanternMesh = new THREE.Mesh(new THREE.CylinderGeometry(2.3, 2.3, 4.2, 12), new THREE.MeshBasicMaterial({ color: 0xffedd5, fog: false }));
    lanternMesh.position.y = 46.8;
    lighthouseGroup.add(lanternMesh);

    const lhBeaconLight = new THREE.PointLight(0xfef08a, 3.5, 90, 1.8);
    lhBeaconLight.position.set(0, 46.8, 0);
    lighthouseGroup.add(lhBeaconLight);

    harborBgGroup.add(lighthouseGroup);
    scene.add(harborBgGroup);

    // 8. AUTOMATED GUIDED VEHICLES (AGVs) - IN WATERSIDE APRON (Z <= -32)
    const agvBlueMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.35, metalness: 0.6 });
    const agvWheelMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.8 });
    const agvConfigs = [
      { z: -32, startX: 140, endX: -140, speed: 16, color: 'blue', payload: '40ft' },
      { z: -48, startX: -150, endX: 150, speed: 18, color: 'blue', payload: '40ft' },
      { z: -64, startX: 140, endX: -140, speed: 14, color: 'blue', payload: '20ft' },
    ];
    const activeAgvs = [];
    agvConfigs.forEach((cfg) => {
      const grp = new THREE.Group();
      grp.position.set(cfg.startX, 0, cfg.z);
      if (cfg.endX < cfg.startX) grp.rotation.y = Math.PI;

      const chassis = new THREE.Mesh(new THREE.BoxGeometry(13.5, 1.2, 3.2), agvBlueMat);
      chassis.position.y = 1.0;
      grp.add(chassis);

      const wheels = [];
      const whGeo = new THREE.CylinderGeometry(0.55, 0.55, 0.45, 14);
      whGeo.rotateX(Math.PI / 2);
      [-4.6, -1.5, 1.5, 4.6].forEach((wx) => {
        const w1 = new THREE.Mesh(whGeo, agvWheelMat); w1.position.set(wx, 0.55, 1.6);
        const w2 = new THREE.Mesh(whGeo, agvWheelMat); w2.position.set(wx, 0.55, -1.6);
        grp.add(w1); grp.add(w2);
        wheels.push(w1, w2);
      });

      if (cfg.payload === '40ft') {
        const c = new THREE.Mesh(new THREE.BoxGeometry(12.5, 3.2, 3.0), new THREE.MeshStandardMaterial({ color: 0x0369a1 }));
        c.position.set(0, 3.2, 0); grp.add(c);
      }
      scene.add(grp);
      activeAgvs.push({ group: grp, wheels, startX: cfg.startX, endX: cfg.endX, speed: cfg.speed });
    });

    // 8B. DEDICATED YELLOW AUTOMATED PORT ESCORT ROBOT VEHICLE
    // Positioned strictly on the terminal service shoulder lane at X = 36 (completely clear of trucks at X = -22, 0, 22)
    const agvYellowMat = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.35, metalness: 0.55 });
    const yellowEscortGroup = new THREE.Group();
    yellowEscortGroup.position.set(36, 0, 14);

    const yellowChassis = new THREE.Mesh(new THREE.BoxGeometry(3.0, 1.2, 7.5), agvYellowMat);
    yellowChassis.position.y = 1.0;
    yellowEscortGroup.add(yellowChassis);

    const yellowWheels = [];
    const yWhGeo = new THREE.CylinderGeometry(0.55, 0.55, 0.45, 14);
    yWhGeo.rotateZ(Math.PI / 2);
    [-2.4, 0, 2.4].forEach((wz) => {
      const wL = new THREE.Mesh(yWhGeo, agvWheelMat); wL.position.set(-1.6, 0.55, wz);
      const wR = new THREE.Mesh(yWhGeo, agvWheelMat); wR.position.set(1.6, 0.55, wz);
      yellowEscortGroup.add(wL); yellowEscortGroup.add(wR);
      yellowWheels.push(wL, wR);
    });
    const yStrobe = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.4, 8), new THREE.MeshBasicMaterial({ color: 0xfbbf24 }));
    yStrobe.position.set(0, 1.8, 2.8);
    yellowEscortGroup.add(yStrobe);
    scene.add(yellowEscortGroup);

    // 9. GANTRY CRANES WITH STEPPED BASES (Zero Z-fighting)
    const craneMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, metalness: 0.65, roughness: 0.28 });
    const bogieMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.85, roughness: 0.25 });
    [-22, 0, 22].forEach((xPos) => {
      const gantry = new THREE.Group();
      gantry.position.set(xPos, 0, 0);
      [-4.8, 4.8].forEach((legX) => {
        [-4, 34].forEach((zPos) => {
          const bogie = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.7, 1.8), bogieMat);
          bogie.position.set(legX, 0.85, zPos);
          gantry.add(bogie);

          const flange = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.16, 1.8), bogieMat);
          flange.position.set(legX, 1.28, zPos);
          gantry.add(flange);

          const col = new THREE.Mesh(new THREE.BoxGeometry(1.3, 36.6, 1.3), craneMat);
          col.position.set(legX, 19.66, zPos);
          gantry.add(col);
        });
        const tie = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.4, 38), craneMat);
        tie.position.set(legX, 12.0, 15);
        gantry.add(tie);
      });
      const boom = new THREE.Mesh(new THREE.BoxGeometry(2.4, 2.6, 68), craneMat);
      boom.position.set(0, 38.2, -7.5);
      gantry.add(boom);

      // Crane work floodlights illuminating quayside
      const cLight = new THREE.PointLight(0xffedd5, 1.6, 60, 2.0);
      cLight.position.set(0, 35, 14);
      gantry.add(cLight);

      scene.add(gantry);
    });

    // 10. CONTAINER SHIP (NO YELLOW TUG LABELS, DUAL-SIDED CUSTOM LETTERING)
    const shipGroup = new THREE.Group();
    shipGroup.position.set(-120, 0, -26);

    const hullShape = new THREE.Shape();
    hullShape.moveTo(-75, -2); hullShape.lineTo(55, -2);
    hullShape.quadraticCurveTo(75, 0, 86, 12); hullShape.lineTo(82, 17);
    hullShape.lineTo(-72, 17); hullShape.lineTo(-75, -2);
    const hullExt = new THREE.ExtrudeGeometry(hullShape, { depth: 26, bevelEnabled: true, bevelSize: 0.8, steps: 1 });
    hullExt.center();
    const hullMesh = new THREE.Mesh(hullExt, new THREE.MeshStandardMaterial({ color: 0x0f2338, metalness: 0.55, roughness: 0.35 }));
    hullMesh.position.y = 6.0;
    shipGroup.add(hullMesh);

    

    // Bridge superstructure tower
    const bridgeGroup = new THREE.Group();
    bridgeGroup.position.set(52, 14.5, 0);
    const bridgeMesh = new THREE.Mesh(new THREE.BoxGeometry(16, 12, 22), new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.3 }));
    bridgeGroup.add(bridgeMesh);
    const bridgeGlass = new THREE.Mesh(new THREE.BoxGeometry(16.2, 2.4, 22.2), new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.1, metalness: 0.9 }));
    bridgeGlass.position.y = 3.5;
    bridgeGroup.add(bridgeGlass);
    shipGroup.add(bridgeGroup);

    // Professional Typography Banners (Dock & Sea sides)
    const hCanvas = document.createElement('canvas');
    hCanvas.width = 1024; hCanvas.height = 128;
    const hc = hCanvas.getContext('2d');
    hc.fillStyle = '#0f2338'; hc.fillRect(0, 0, 1024, 128);
    hc.textAlign = 'center'; hc.fillStyle = '#f8fafc'; hc.font = 'bold 44px monospace';
    hc.fillText('EDUARDO DE SOUSA LINES // ROTTERDAM', 512, 65);
    hc.fillStyle = '#38bdf8'; hc.font = 'bold 24px monospace';
    hc.fillText('GLOBAL SOURCING & SUPPLY CHAIN NETWORK · IMO 9840217', 512, 104);
    const hTex = new THREE.CanvasTexture(hCanvas);
    hTex.needsUpdate = true;

    const bannerDock = new THREE.Mesh(new THREE.PlaneGeometry(120, 9.5), new THREE.MeshBasicMaterial({ map: hTex, side: THREE.DoubleSide }));
    bannerDock.position.set(0, 8.5, 13.1);
    shipGroup.add(bannerDock);

    const bannerSea = new THREE.Mesh(new THREE.PlaneGeometry(120, 9.5), new THREE.MeshBasicMaterial({ map: hTex, side: THREE.DoubleSide }));
    bannerSea.position.set(0, 8.5, -13.1);
    bannerSea.rotation.y = Math.PI;
    shipGroup.add(bannerSea);

    
    // Bow Name Typography (Prominently visible on bow quarter)
    const bowCanvas = document.createElement('canvas');
    bowCanvas.width = 512; bowCanvas.height = 128;
    const bc = bowCanvas.getContext('2d');
    bc.fillStyle = '#0f2338'; bc.fillRect(0, 0, 512, 128);
    bc.fillStyle = '#f8fafc'; bc.font = 'bold 52px monospace';
    bc.textAlign = 'center';
    bc.fillText('EDUARDO DE SOUSA', 256, 68);
    bc.fillStyle = '#38bdf8'; bc.font = 'bold 26px monospace';
    bc.fillText('ROTTERDAM', 256, 106);
    const bowTex = new THREE.CanvasTexture(bowCanvas);
    bowTex.needsUpdate = true;

    const bowSign = new THREE.Mesh(new THREE.PlaneGeometry(36, 9), new THREE.MeshBasicMaterial({ map: bowTex, side: THREE.DoubleSide }));
    bowSign.position.set(50, 9.2, -13.15);
    bowSign.rotation.y = Math.PI;
    shipGroup.add(bowSign);

    scene.add(shipGroup);

    // 11. CONTAINERS
    const contGeo = new THREE.BoxGeometry(12.5, 3.2, 3.0);
    const cMat1 = new THREE.MeshStandardMaterial({ color: 0x0284c7, metalness: 0.4, roughness: 0.35 });
    const cMat2 = new THREE.MeshStandardMaterial({ color: 0xd97706, metalness: 0.4, roughness: 0.35 });
    const cMat3 = new THREE.MeshStandardMaterial({ color: 0x059669, metalness: 0.4, roughness: 0.35 });
    const cont1 = new THREE.Mesh(contGeo, cMat1);
    const cont2 = new THREE.Mesh(contGeo, cMat2);
    const cont3 = new THREE.Mesh(contGeo, cMat3);
    scene.add(cont1); scene.add(cont2); scene.add(cont3);

    // 12. THREE ELECTRIC TRUCKS (X = -22, 0, 22)
    const trucks = [];
    [-22, 0, 22].forEach((xP) => {
      const trk = new THREE.Group();
      trk.position.set(xP, 0, 14);

      const cab = new THREE.Mesh(new THREE.BoxGeometry(3.2, 4.4, 4.2), new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.25 }));
      cab.position.set(0, 3.4, 7.8);
      trk.add(cab);

      // Windshield & Headlights
      const wGlass = new THREE.Mesh(new THREE.BoxGeometry(3.0, 1.8, 0.2), new THREE.MeshBasicMaterial({ color: 0x38bdf8 }));
      wGlass.position.set(0, 4.2, 9.91);
      trk.add(wGlass);

      const hLightL = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.4, 0.1), new THREE.MeshBasicMaterial({ color: 0xffffff }));
      hLightL.position.set(-1.1, 2.2, 9.91);
      trk.add(hLightL);
      const hLightR = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.4, 0.1), new THREE.MeshBasicMaterial({ color: 0xffffff }));
      hLightR.position.set(1.1, 2.2, 9.91);
      trk.add(hLightR);

      const bed = new THREE.Mesh(new THREE.BoxGeometry(3.1, 0.45, 13.0), new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.6 }));
      bed.position.set(0, 1.6, -0.6);
      trk.add(bed);

      const trkWheelGeo = new THREE.CylinderGeometry(0.55, 0.55, 0.45, 14);
      trkWheelGeo.rotateZ(Math.PI / 2);
      [-5.5, -4.1, 6.2].forEach((zP) => {
        [-1.4, 1.4].forEach((wX) => {
          const w = new THREE.Mesh(trkWheelGeo, agvWheelMat);
          w.position.set(wX, 0.55, zP);
          trk.add(w);
        });
      });
      scene.add(trk);
      trucks.push(trk);
    });

    // --- ANIMATION CONTROLS & TIMELINE ---
    let currentTime = 0;
    let isPlaying = true;
    let playbackRate = 1.0;
    let loopEnabled = true;
    let lastTimestamp = performance.now();

    const phaseDisplay = document.getElementById('phaseDisplay');
    const timeDisplay = document.getElementById('timeDisplay');
    const scrubber = document.getElementById('scrubber');
    const btnPlayPause = document.getElementById('btnPlayPause');
    const btnRestart = document.getElementById('btnRestart');
    const btnAct1 = document.getElementById('btnAct1');
    const btnAct2 = document.getElementById('btnAct2');
    const btnAct3 = document.getElementById('btnAct3');
    const btnToggleLoop = document.getElementById('btnToggleLoop');

    function updateSequence(tSec) {
      currentTime = Math.max(0, Math.min(7.5, tSec));
      scrubber.value = currentTime;
      timeDisplay.innerText = `T = ${currentTime.toFixed(2)}s / 7.50s`;
      const normT = currentTime / 7.5;

      // AGV Animation along waterside apron
      activeAgvs.forEach((agv) => {
        const dist = Math.abs(agv.endX - agv.startX);
        const dur = dist / agv.speed;
        const prog = ((currentTime * 0.85) % dur) / dur;
        agv.group.position.x = THREE.MathUtils.lerp(agv.startX, agv.endX, prog);
        const wheelAngle = agv.group.position.x / 0.55;
        agv.wheels.forEach((w) => { w.rotation.z = -wheelAngle; });
      });

      // =======================================================================
      // ACT I (0.0s - 2.5s): OCEAN CONTAINER VESSEL ARRIVAL & BERTHING
      // Vessel glides in from ocean left; motion immediately visible at T = 0.0s
      // =======================================================================
      if (normT < 0.33) {
        phaseDisplay.innerText = 'ACT I // OCEAN CONTAINER VESSEL BERTHING AT TERMINAL';
        const st = normT / 0.33;
        // Smooth maritime deceleration from X = -120 to X = 0
        const easeShip = Math.sin(st * Math.PI * 0.5);
        const shipX = -170 + easeShip * 170;
        shipGroup.position.x = shipX;

        cont1.rotation.y = Math.PI / 2;
        cont2.rotation.y = Math.PI / 2;
        cont3.rotation.y = Math.PI / 2;
        cont1.position.set(shipX - 22, 16.5, -26);
        cont2.position.set(shipX, 16.5, -26);
        cont3.position.set(shipX + 22, 16.5, -26);

        trucks.forEach((trk) => { trk.position.z = 14; });
        yellowEscortGroup.position.z = 14;

        // Along-berth cinematic tracking: incoming container ship glides into berth under gantry cranes
        const camX = THREE.MathUtils.lerp(126, 114, st);
        const camY = THREE.MathUtils.lerp(26, 22, st);
        const camZ = THREE.MathUtils.lerp(-60, -52, st);
        camera.position.set(camX, camY, camZ);
        camera.lookAt(THREE.MathUtils.lerp(-25, 0, st), 12.0, -20);
      }
      // =======================================================================
      // ACT II (2.5s - 5.0s): GANTRY CRANES UNLOADING 40HQ CONTAINERS ONTO FLEET
      // =======================================================================
      else if (normT < 0.67) {
        phaseDisplay.innerText = 'ACT II // QUAYSIDE GANTRY CRANES UNLOADING 3x 40HQ ONTO FLEET';
        shipGroup.position.x = 0;
        const lt = (normT - 0.33) / 0.34;

        if (lt < 0.25) {
          cont1.rotation.y = Math.PI / 2; cont1.position.set(-22, 16.5, -26);
          cont2.rotation.y = Math.PI / 2; cont2.position.set(0, 16.5, -26);
          cont3.rotation.y = Math.PI / 2; cont3.position.set(22, 16.5, -26);
        } else if (lt < 0.75) {
          const tTransfer = (lt - 0.25) / 0.50;
          const eTransfer = 0.5 - 0.5 * Math.cos(tTransfer * Math.PI);
          const zPos = THREE.MathUtils.lerp(-26, 13.4, eTransfer);
          const yPos = 16.5 + Math.sin(tTransfer * Math.PI) * 12.0;
          const rotY = Math.PI / 2 + eTransfer * (Math.PI / 2);

          cont1.rotation.y = rotY; cont1.position.set(-22, yPos, zPos);
          cont2.rotation.y = rotY; cont2.position.set(0, yPos, zPos);
          cont3.rotation.y = rotY; cont3.position.set(22, yPos, zPos);
        } else {
          const tLower = (lt - 0.75) / 0.25;
          const yPos = THREE.MathUtils.lerp(16.5, 3.4, tLower);
          cont1.rotation.y = 0; cont1.position.set(-22, yPos, 13.4);
          cont2.rotation.y = 0; cont2.position.set(0, yPos, 13.4);
          cont3.rotation.y = 0; cont3.position.set(22, yPos, 13.4);
        }

        trucks.forEach((trk) => { trk.position.z = 14; });
        yellowEscortGroup.position.z = 14;

        // Dynamic crane hoist perspective unobstructed by columns
        const camX = THREE.MathUtils.lerp(-24, -8, lt);
        const camY = THREE.MathUtils.lerp(18, 12, lt);
        const camZ = THREE.MathUtils.lerp(50, 38, lt);
        camera.position.set(camX, camY, camZ);
        camera.lookAt(0, 8.5, 4);
      }
      // =======================================================================
      // ACT III (5.0s - 7.5s): FLEET DISPATCH CONVOY & PORTFOLIO LAUNCH
      // =======================================================================
      else {
        phaseDisplay.innerText = 'ACT III // HIGH-SPEED LOGISTICS DISPATCH & PORTFOLIO LAUNCH';
        shipGroup.position.x = 0;
        const dt = (normT - 0.67) / 0.33;
        const easeDrive = Math.pow(dt, 2.0);
        const driveDist = easeDrive * 150;

        cont1.rotation.y = 0; cont1.position.set(-22, 3.4, 13.4 + driveDist);
        cont2.rotation.y = 0; cont2.position.set(0, 3.4, 13.4 + driveDist * 1.06);
        cont3.rotation.y = 0; cont3.position.set(22, 3.4, 13.4 + driveDist);

        trucks[0].position.z = 14 + driveDist;
        trucks[1].position.z = 14 + driveDist * 1.06;
        trucks[2].position.z = 14 + driveDist;

        // Dedicated yellow escort robot vehicle accelerates forward along right service shoulder (X = 36)
        yellowEscortGroup.position.z = 14 + driveDist * 0.96;
        yellowWheels.forEach((w) => { w.rotation.x += dt * 25; });

        // Elevated diagonal chase camera tracking convoy down terminal highway
        const leadTruckZ = trucks[1].position.z;
        const camX = THREE.MathUtils.lerp(-14, -4, dt);
        const camY = THREE.MathUtils.lerp(12, 8.0, dt);
        const camZ = leadTruckZ + THREE.MathUtils.lerp(46, 28, dt);
        camera.position.set(camX, camY, camZ);
        camera.lookAt(2.0, 4.5, leadTruckZ + 8);
      }

      renderer.render(scene, camera);
    }

    function animate(now) {
      requestAnimationFrame(animate);
      const delta = (now - lastTimestamp) / 1000;
      lastTimestamp = now;

      if (isPlaying) {
        let nextTime = currentTime + delta * playbackRate;
        if (nextTime >= 7.5) {
          if (loopEnabled) {
            nextTime = 0;
          } else {
            nextTime = 7.5;
            isPlaying = false;
            btnPlayPause.innerText = '▶ PLAY';
          }
        }
        updateSequence(nextTime);
      }
    }
    requestAnimationFrame(animate);

    // Controls Event Listeners
    scrubber.addEventListener('input', (e) => {
      isPlaying = false;
      btnPlayPause.innerText = '▶ PLAY';
      updateSequence(parseFloat(e.target.value));
    });
    btnPlayPause.addEventListener('click', () => {
      isPlaying = !isPlaying;
      btnPlayPause.innerText = isPlaying ? '⏸ PAUSE' : '▶ PLAY';
    });
    btnRestart.addEventListener('click', () => {
      updateSequence(0);
      isPlaying = true;
      btnPlayPause.innerText = '⏸ PAUSE';
    });
    btnAct1.addEventListener('click', () => { updateSequence(0.1); isPlaying = true; btnPlayPause.innerText = '⏸ PAUSE'; });
    btnAct2.addEventListener('click', () => { updateSequence(2.6); isPlaying = true; btnPlayPause.innerText = '⏸ PAUSE'; });
    btnAct3.addEventListener('click', () => { updateSequence(5.1); isPlaying = true; btnPlayPause.innerText = '⏸ PAUSE'; });
    btnToggleLoop.addEventListener('click', () => {
      loopEnabled = !loopEnabled;
      btnToggleLoop.innerText = `LOOP: ${loopEnabled ? 'ON' : 'OFF'}`;
      btnToggleLoop.classList.toggle('active', loopEnabled);
    });

    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      renderer.render(scene, camera);
    });

    updateSequence(0);
  </script>
</body>
</html>
