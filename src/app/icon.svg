<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="grad-text" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a5f3fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Shield/Hexagon Background -->
  <polygon 
    points="32,3 58,18 58,46 32,61 6,46 6,18" 
    fill="#07090e" 
    stroke="url(#grad-border)" 
    stroke-width="3" 
    stroke-linejoin="round"
  />

  <!-- Subtle Inner Circuit Accent -->
  <polygon 
    points="32,8 53,20 53,44 32,56 11,44 11,20" 
    fill="none" 
    stroke="#06b6d4" 
    stroke-width="1" 
    stroke-opacity="0.25"
    stroke-dasharray="3,3"
  />

  <!-- Monogram ED -->
  <text 
    x="32" 
    y="41" 
    text-anchor="middle" 
    fill="url(#grad-text)" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="24" 
    font-weight="900" 
    letter-spacing="-1.5"
    filter="url(#glow)"
  >ED</text>

  <!-- Mini High-Tech Quantum Dot -->
  <circle cx="48" cy="20" r="2.5" fill="#10b981" />
</svg>
